[package]
name = "sway_productivity_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cosmic-text = "0.19.0"
dirs = "7.0.0"
env_logger = "0.11.11"
fs2 = "0.4.3"
ordered-float = "5.5.1"
rand = "0.10.3"
ron = "0.12.3"
